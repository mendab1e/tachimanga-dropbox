name: Build Dropbox extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test and compile
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
        run: ./gradlew --no-daemon :extension:testDebugUnitTest :extension:assembleRelease
      - name: Package and verify
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: dropbox-extension
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: extension/build/reports/tests/testDebugUnitTest/
